<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>{% block title %}Ledger Portal{% endblock %} - Meridian Freight</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#222;margin:0}
header{background:#12355b;color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}header a{color:#cfe2f7;margin-left:16px;font-size:14px}
main{max-width:820px;margin:24px auto;padding:0 18px}.card{background:#fff;border:1px solid #d5dbe3;border-radius:6px;padding:18px 22px;margin-bottom:16px}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #d5dbe3;padding:7px 10px;font-size:14px;text-align:left}th{background:#e3eaf3}
input{padding:8px;width:100%;margin:6px 0 12px;border:1px solid #bbc;border-radius:4px}button{background:#12355b;color:#fff;border:0;padding:9px 18px;border-radius:4px;cursor:pointer}
.err{color:#a02020;margin-bottom:8px}.meta{color:#667;font-size:13px}a{color:#12508f}
</style></head><body>
<header><h1>Meridian Freight &middot; Ledger Portal</h1>
<div>{% if user %}<span class="meta" style="color:#a9c3e0">{{ user.name }} ({{ user.staff_id }})</span>
<a href="{{ url_for('dashboard') }}">My statements</a><a href="{{ url_for('logout') }}">Log out</a>{% endif %}</div></header>
<main>{% block body %}{% endblock %}</main></body></html>
